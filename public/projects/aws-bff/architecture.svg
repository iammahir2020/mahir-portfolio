<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="60" y="50" font-size="16" letter-spacing="3" fill="#60a5fa" fill-opacity="0.85" font-weight="700">SERVERLESS BFF ON AWS // ARCHITECTURE</text>

  <!-- style helper via reused attrs -->

  <!-- Client -->
  <rect x="470" y="80" width="260" height="64" rx="10" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="600" y="106" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">REACT CLIENT</text>
  <text x="600" y="126" text-anchor="middle" font-size="11" fill="#93c5fd">(AWS Amplify + Cognito JWT)</text>

  <!-- API Gateway -->
  <rect x="180" y="230" width="240" height="64" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="300" y="256" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">API GATEWAY</text>
  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#93c5fd">Cognito authorizer</text>

  <!-- AppSync -->
  <rect x="780" y="230" width="240" height="64" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="900" y="256" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">APPSYNC</text>
  <text x="900" y="276" text-anchor="middle" font-size="11" fill="#93c5fd">onOrderUpdate subscription</text>

  <!-- Lambda GetOrders -->
  <rect x="180" y="360" width="240" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="386" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">LAMBDA</text>
  <text x="300" y="406" text-anchor="middle" font-size="11" fill="#fcd34d">GetOrdersFn</text>

  <!-- Lambda StreamHandler -->
  <rect x="780" y="360" width="240" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="900" y="386" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">LAMBDA</text>
  <text x="900" y="406" text-anchor="middle" font-size="11" fill="#fcd34d">StreamHandlerFn (SigV4)</text>

  <!-- DynamoDB -->
  <rect x="470" y="480" width="260" height="72" rx="10" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="600" y="508" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">DYNAMODB</text>
  <text x="600" y="528" text-anchor="middle" font-size="11" fill="#93c5fd">PriceProjection (read model)</text>
  <text x="600" y="544" text-anchor="middle" font-size="10" fill="#64748b">Streams: NEW_IMAGE</text>

  <!-- Producer pipeline -->
  <rect x="60" y="640" width="220" height="64" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="170" y="666" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">EVENTBRIDGE</text>
  <text x="170" y="686" text-anchor="middle" font-size="11" fill="#6ee7b7">bff-microservice-bus</text>

  <rect x="330" y="640" width="220" height="64" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="662" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">SQS</text>
  <text x="440" y="680" text-anchor="middle" font-size="11" fill="#6ee7b7">ProjectionQueue</text>
  <text x="440" y="696" text-anchor="middle" font-size="10" fill="#64748b">3 fails → ProjectionDLQ</text>

  <rect x="600" y="640" width="240" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="720" y="666" text-anchor="middle" font-size="14" fill="#e2e8f0" font-weight="700">LAMBDA</text>
  <text x="720" y="686" text-anchor="middle" font-size="11" fill="#fcd34d">EventConsumerFn</text>

  <!-- Arrows -->
  <!-- client -> api gateway -->
  <path d="M540 144 L320 230" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="195" font-size="10" fill="#64748b">GET /prod + JWT</text>

  <!-- appsync -> client (subscription push) -->
  <path d="M860 230 L660 144" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="195" font-size="10" fill="#64748b">live delta (wss)</text>

  <!-- api gateway -> lambda getorders -->
  <path d="M300 294 L300 360" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- lambda getorders -> dynamodb -->
  <path d="M370 424 L560 480" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="450" font-size="10" fill="#64748b">Scan</text>

  <!-- dynamodb streams -> lambda streamhandler -->
  <path d="M700 490 L900 424" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="450" font-size="10" fill="#64748b">Stream event</text>

  <!-- lambda streamhandler -> appsync -->
  <path d="M900 360 L900 294" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="330" font-size="10" fill="#64748b">publishOrderUpdate</text>

  <!-- eventbridge -> sqs -->
  <path d="M280 672 L330 672" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- sqs -> lambda eventconsumer -->
  <path d="M550 672 L600 672" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- lambda eventconsumer -> dynamodb -->
  <path d="M700 640 L620 552" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="600" font-size="10" fill="#64748b">UpdateItem</text>

  <text x="600" y="780" text-anchor="middle" font-size="17" letter-spacing="3" fill="#93c5fd" font-weight="700">SERVERLESS BACKEND-FOR-FRONTEND</text>
</svg>
